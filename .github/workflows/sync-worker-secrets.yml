# Doppler `codice` `prd` → the secrets each Códice Worker declares (`secrets.required` in
# apps/*/wrangler.jsonc), on the Handle Cloudflare account.
#
# Auth holds no long-lived secret in GitHub: the job exchanges its OIDC token for a short-lived
# Doppler token through its own Service Account Identity (`codice-worker-secrets`), then pushes the
# Worker's declared secrets with scripts/secrets/sync-worker-secrets.mjs, which reads the scoped
# Cloudflare token CLOUDFLARE_WORKER_SECRETS_TOKEN from `prd`.
#
# A Doppler webhook on `codice` `prd` sends `repository_dispatch` (doppler-config-changed) on every
# change; those runs skip unless `prd` changed since the last successful dispatched run. A daily
# run retries a lost webhook delivery or a failed run. Manual runs plan by default.
# Setup: docs/operations/doppler-secrets.md, "Worker secret sync".
name: Sync Worker secrets

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply (unchecked = plan only)
        default: false
        type: boolean
      prune:
        description: Delete Worker secrets that are not in Doppler
        default: false
        type: boolean
  repository_dispatch:
    types: [doppler-config-changed]
  schedule:
    - cron: "47 6 * * *"

concurrency:
  group: sync-worker-secrets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install Doppler CLI
        run: |
          set -euo pipefail
          curl -sLf --retry 3 https://cli.doppler.com/install.sh | sudo sh
          doppler --version

      - name: Doppler OIDC login
        env:
          # Doppler Service Account Identity `handlemotion-codice-main-secrets` on
          # codice-worker-secrets (read on `codice` `prd` only), whose subject is this repository's
          # `main` (docs/operations/doppler-secrets.md). An ID, not a secret.
          DOPPLER_IDENTITY_ID: f6767a91-e8b5-40cd-91db-ac7432e8d5d6
        run: |
          set -euo pipefail
          OIDC_TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/handlemotion" | jq -r .value)
          # Claims are not secret; print the ones Doppler validates so a mismatch is diagnosable.
          echo "$OIDC_TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq -r '"oidc sub=\(.sub) aud=\(.aud) iss=\(.iss)"' || true
          doppler oidc login --scope=. --identity="$DOPPLER_IDENTITY_ID" --token="$OIDC_TOKEN" --no-check-version
          doppler me --json --no-check-version | jq -r '"authenticated as \(.name // .slug)"'

      - name: Last successful dispatched run
        if: github.event_name == 'repository_dispatch'
        id: watermark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since=$(gh run list --workflow "${{ github.workflow }}" --event repository_dispatch \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          echo "since=${since:-1970-01-01T00:00:00Z}" >> "$GITHUB_OUTPUT"

      - name: Sync
        env:
          APPLY: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.apply }}
          PRUNE: ${{ inputs.prune }}
          SINCE: ${{ steps.watermark.outputs.since }}
        run: |
          set -euo pipefail
          args=()
          [[ "$APPLY" == "true" ]] && args+=(--apply)
          [[ "$PRUNE" == "true" ]] && args+=(--prune)
          [[ -n "${SINCE:-}" ]] && args+=(--since "$SINCE")
          doppler run -p codice -c prd --no-check-version -- \
            node scripts/secrets/sync-worker-secrets.mjs "${args[@]}"

      - name: Doppler logout
        if: always()
        run: doppler oidc logout --scope=. --no-check-version || true
